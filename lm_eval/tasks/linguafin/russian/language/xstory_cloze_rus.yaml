task: xstory_cloze_rus
dataset_path: juletxara/xstory_cloze
dataset_name: ru
output_type: multiple_choice

training_split: train
validation_split: eval
test_split: null

# xstory_cloze_rus
doc_to_text: "История: {{input_sentence_1}} {{input_sentence_2}} {{input_sentence_3}} {{input_sentence_4}}\nПродолжение:"
doc_to_choice: ["{{sentence_quiz1}}", "{{sentence_quiz2}}"]
# Correction ici : utilisation du filtre Jinja2
doc_to_target: "{{ (answer_right_ending | int) - 1 }}"

target_delimiter: ""
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true

metadata:
  version: 1.0
