task: tydiqa_rus
dataset_path: google-research-datasets/tydiqa
dataset_name: null
output_type: generate_until

training_split: null
validation_split: valid
test_split: test
fewshot_split: test

doc_to_text: "Контекст: {{context}}\nВопрос: {{question}}\nОтвет:"
doc_to_target: '{{ (answers.text + [""])[0] }}'

generation_kwargs:
  until:
    - "\n"
  do_sample: false
  temperature: 0.0

metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
  - metric: f1
    aggregation: mean
    higher_is_better: true

metadata:
  version: 1.0