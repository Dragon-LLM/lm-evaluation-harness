task: belebele_rus_Cyrl1
dataset_path: facebook/belebele
dataset_name: rus_Cyrl  
output_type: multiple_choice

training_split: null
validation_split: null
test_split: test

# Pas besoin de fewshot_split si num_fewshot est à 0 dans votre commande, 
# mais laissez-le si vous comptez en faire.

doc_to_text: "Текст: {{flores_passage}}\nВопрос: {{question}}\nОтвет:"

# Format correct pour une liste d'options en CF
doc_to_choice: 
  - "{{mc_answer1}}"
  - "{{mc_answer2}}"
  - "{{mc_answer3}}"
  - "{{mc_answer4}}"

# Utilisation sécurisée du filtre int pour transformer "1" en 0, "2" en 1, etc.
doc_to_target: "{{ (correct_answer_num | int) - 1 }}"

# Crucial pour le CF : on ajoute un espace pour que la réponse ne soit pas collée à "Ответ:"
target_delimiter: " "

metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true