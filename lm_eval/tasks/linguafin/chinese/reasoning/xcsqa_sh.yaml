task: xcsqa_zh
dataset_path: INK-USC/xcsr
dataset_name: X-CSQA-zh
output_type: multiple_choice
training_split: null
validation_split: validation
test_split: null

# 1. Le Prompt
# Attention : Dans ce dataset, 'question' est un objet {stem: "...", concept: "..."}
# On utilise donc 'question.stem' pour avoir le texte.
doc_to_text: "问：{{question.stem}}\n答："

# 2. Les Choix
# Le champ 'choices' contient deux listes : 'label' (['A','B'..]) et 'text' (['réponse1', 'réponse2'..])
# On passe la liste des textes au harnais.
doc_to_choice: "{{question.choices.text}}"

# 3. La Cible
# 'answerKey' contient la lettre (ex: "B").
# On cherche l'index de cette lettre dans la liste choices.label
doc_to_target: "{{ 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.index(answerKey) }}"

target_delimiter: ""
metric_list:
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0