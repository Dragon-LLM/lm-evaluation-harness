task: xcsqa_fr
dataset_path: INK-USC/xcsr
dataset_name: X-CSQA-fr
output_type: multiple_choice
training_split: null
validation_split: validation
test_split: null

doc_to_text: "Question ：{{question.stem}}\nRéponse :"
doc_to_choice: "{{question.choices.text}}"
doc_to_target: "{{ 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.index(answerKey) }}"

target_delimiter: " "
metric_list:
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0